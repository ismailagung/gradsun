name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Verification and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
      BETTER_AUTH_SECRET: "01234567890123456789012345678901"
      BETTER_AUTH_URL: "http://localhost:3000"
      CRON_SECRET: "0123456789012345"
      STORAGE_DRIVER: "s3"
      S3_ENDPOINT: "https://placeholder.supabase.co/storage/v1/s3"
      S3_REGION: "ap-southeast-1"
      S3_BUCKET: "photos"
      S3_ACCESS_KEY_ID: "dummy-key-id"
      S3_SECRET_ACCESS_KEY: "dummy-access-key"
      NEXT_PUBLIC_STORAGE_BASE_URL: "https://placeholder.supabase.co/storage/v1/object/public/photos"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run verification checks
        run: npm run check

      - name: Build application
        run: npm run build
